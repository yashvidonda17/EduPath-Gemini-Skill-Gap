openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ai
    description: AI-powered career learning operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /skill-gap-analysis:
    post:
      operationId: analyzeSkillGap
      tags: [ai]
      summary: Analyze a learner's skills against a target career
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillGapAnalysisInput"
      responses:
        "200":
          description: AI-generated skill gap analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillGapAnalysis"
        "400":
          description: Invalid profile
        "500":
          description: AI analysis failed
  /learning-roadmap:
    post:
      operationId: generateLearningRoadmap
      tags: [ai]
      summary: Generate a personalized learning roadmap from skill gaps
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningRoadmapInput"
      responses:
        "200":
          description: AI-generated learning roadmap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningRoadmap"
        "400":
          description: Invalid skill gap input
        "500":
          description: Roadmap generation failed
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    LearnerProfile:
      type: object
      properties:
        targetCareer:
          type: string
          minLength: 1
        skills:
          type: array
          items:
            type: string
            minLength: 1
        experience:
          type: string
          minLength: 1
        weeklyHours:
          type: string
          minLength: 1
        learningGoal:
          type: string
          minLength: 1
      required:
        - targetCareer
        - skills
        - experience
        - weeklyHours
        - learningGoal
    SkillGapAnalysisInput:
      type: object
      allOf:
        - $ref: "#/components/schemas/LearnerProfile"
      properties:
        resume:
          $ref: "#/components/schemas/ResumeAttachment"
    ResumeAttachment:
      type: object
      properties:
        fileName:
          type: string
          minLength: 1
        mimeType:
          type: string
          enum: [application/pdf, text/plain]
        data:
          type: string
          minLength: 1
          maxLength: 12000000
      required:
        - fileName
        - mimeType
        - data
    SkillRequirement:
      type: object
      properties:
        name:
          type: string
        importance:
          type: string
          enum: [Critical, High, Medium, Low]
      required:
        - name
        - importance
    AcquiredSkill:
      type: object
      properties:
        name:
          type: string
        importance:
          type: string
          enum: [Critical, High, Medium, Low]
        evidence:
          type: string
      required:
        - name
        - importance
        - evidence
    MissingSkill:
      type: object
      properties:
        name:
          type: string
        importance:
          type: string
          enum: [Critical, High, Medium, Low]
        explanation:
          type: string
      required:
        - name
        - importance
        - explanation
    SkillGapAnalysis:
      type: object
      properties:
        targetCareer:
          type: string
        roleRequirements:
          type: array
          items:
            $ref: "#/components/schemas/SkillRequirement"
        acquiredSkills:
          type: array
          items:
            $ref: "#/components/schemas/AcquiredSkill"
        missingSkills:
          type: array
          items:
            $ref: "#/components/schemas/MissingSkill"
        matchPercentage:
          type: integer
          minimum: 0
          maximum: 100
        explanation:
          type: string
        resumeProfile:
          $ref: "#/components/schemas/ResumeProfile"
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
        learningObjectives:
          type: array
          items:
            $ref: "#/components/schemas/LearningObjective"
      required:
        - targetCareer
        - roleRequirements
        - acquiredSkills
        - missingSkills
        - matchPercentage
        - explanation
        - resumeProfile
        - capabilities
        - learningObjectives
    ResumeProfile:
      type: object
      properties:
        skills:
          type: array
          items:
            type: string
        projects:
          type: array
          items:
            $ref: "#/components/schemas/ResumeProject"
        experience:
          type: array
          items:
            $ref: "#/components/schemas/ResumeExperience"
        certifications:
          type: array
          items:
            $ref: "#/components/schemas/ResumeCertification"
        education:
          type: array
          items:
            $ref: "#/components/schemas/ResumeEducation"
      required:
        - skills
        - projects
        - experience
        - certifications
        - education
    ResumeProject:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        technologies:
          type: array
          items:
            type: string
      required:
        - name
        - description
        - technologies
    ResumeExperience:
      type: object
      properties:
        role:
          type: string
        company:
          type: string
        duration:
          type: string
        highlights:
          type: array
          items:
            type: string
      required:
        - role
        - company
        - duration
        - highlights
    ResumeCertification:
      type: object
      properties:
        name:
          type: string
        issuer:
          type: string
        year:
          type: string
      required:
        - name
        - issuer
        - year
    ResumeEducation:
      type: object
      properties:
        institution:
          type: string
        degree:
          type: string
        field:
          type: string
        year:
          type: string
      required:
        - institution
        - degree
        - field
        - year
    Capability:
      type: object
      properties:
        name:
          type: string
        evidence:
          type: string
        level:
          type: string
          enum: [Foundational, Working, Strong]
      required:
        - name
        - evidence
        - level
    LearningObjective:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        relatedSkill:
          type: string
        priority:
          type: string
          enum: [Critical, High, Medium, Low]
      required:
        - title
        - description
        - relatedSkill
        - priority
    LearningRoadmapInput:
      type: object
      properties:
        profile:
          $ref: "#/components/schemas/LearnerProfile"
        skillGaps:
          type: array
          items:
            $ref: "#/components/schemas/MissingSkill"
          minItems: 1
      required:
        - profile
        - skillGaps
    RoadmapStep:
      type: object
      properties:
        title:
          type: string
        focusSkill:
          type: string
        priority:
          type: string
          enum: [Critical, High, Medium, Low]
        duration:
          type: string
        actions:
          type: array
          items:
            type: string
        outcome:
          type: string
      required:
        - title
        - focusSkill
        - priority
        - duration
        - actions
        - outcome
    RoadmapLearningResource:
      type: object
      properties:
        title:
          type: string
        skill:
          type: string
        url:
          type: string
          format: uri
        difficulty:
          type: string
          enum: [Beginner, Intermediate, Advanced]
        estimatedTime:
          type: string
        expectedOutcome:
          type: string
      required:
        - title
        - skill
        - url
        - difficulty
        - estimatedTime
        - expectedOutcome
    RoadmapExercise:
      type: object
      properties:
        title:
          type: string
        skill:
          type: string
        difficulty:
          type: string
          enum: [Beginner, Intermediate, Advanced]
        estimatedTime:
          type: string
        expectedOutcome:
          type: string
      required:
        - title
        - skill
        - difficulty
        - estimatedTime
        - expectedOutcome
    RoadmapProjectIdea:
      type: object
      properties:
        title:
          type: string
        skill:
          type: string
        difficulty:
          type: string
          enum: [Beginner, Intermediate, Advanced]
        estimatedTime:
          type: string
        expectedOutcome:
          type: string
      required:
        - title
        - skill
        - difficulty
        - estimatedTime
        - expectedOutcome
    LearningRoadmap:
      type: object
      properties:
        targetCareer:
          type: string
        summary:
          type: string
        steps:
          type: array
          items:
            $ref: "#/components/schemas/RoadmapStep"
        resources:
          type: array
          items:
            $ref: "#/components/schemas/RoadmapLearningResource"
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/RoadmapExercise"
        projects:
          type: array
          items:
            $ref: "#/components/schemas/RoadmapProjectIdea"
      required:
        - targetCareer
        - summary
        - steps
        - resources
        - exercises
        - projects

